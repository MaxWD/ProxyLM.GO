# golangci-lint v2 config for ProxyLM.GO
# Run: golangci-lint run
# Migration guide: https://golangci-lint.run/docs/product/migration-guide

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Default set (gosimple is merged into staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Extras
    - misspell
    - unconvert
    - bodyclose       # net/http resp.Body must be closed
    - contextcheck    # context.Context propagation
    - errorlint       # %w for error wrapping
    - nilerr
    - rowserrcheck    # database/sql Rows.Err()
    - sqlclosecheck   # *sql.Rows / *sql.Stmt must be closed
  exclusions:
    rules:
      # Tests may use long functions and skip a few checks.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - proxylm

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
