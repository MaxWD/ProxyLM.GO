# golangci-lint v2 config for ProxyLM.GO
# Run: golangci-lint run
# Migration guide: https://golangci-lint.run/docs/product/migration-guide

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Default set (gosimple is merged into staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Extras
    - misspell
    - unconvert
    - bodyclose       # net/http resp.Body must be closed
    - contextcheck    # context.Context propagation
    - errorlint       # %w for error wrapping
    - rowserrcheck    # database/sql Rows.Err()
    - sqlclosecheck   # *sql.Rows / *sql.Stmt must be closed
  exclusions:
    rules:
      # Tests may use long functions and skip a few checks.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      # `defer x.Close()` is idiomatic Go; the close-error is rarely actionable.
      - linters: [errcheck]
        source: 'defer\s+[\w.()]+\.Close\(\)'
      # staticcheck QF*** are *quick-fix* style hints, not bugs (e.g. lifting
      # if into for-condition). Keep semantic checks (SA***, S***), drop QF.
      - linters: [staticcheck]
        text: '^QF\d+:'
      # persistRecord intentionally detaches from r.Context() (see comment in
      # routes_openai.go) — a client disconnect must not lose the final write.
      - linters: [contextcheck]
        path: internal/api/routes_openai\.go
        source: 'h\.persistRecord\('
      # Graceful shutdown uses its own bounded context, not the inherited one.
      - linters: [contextcheck]
        path: internal/api/server\.go
        source: 's\.srv\.Shutdown\(shutdownCtx\)'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - proxylm

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
