# ProxyLM.GO — пример конфигурации
# Скопируй в config.yaml и подправь под себя.
#
# При первом запуске `proxylm serve` без файла config.yaml рядом с бинарником
# этот шаблон будет автоматически создан там же (он встроен в бинарник
# через //go:embed). Дальше его можно править — изменения подхватятся
# при следующем старте daemon'а (hot-reload в MVP не реализован).

proxy:
  host: 0.0.0.0
  port: 8080
  log_level: info       # debug | info | warning | error

# API-ключи для аутентификации клиентских сервисов.
# Используется заголовок: Authorization: Bearer <key>
auth:
  api_keys:
    - name: service-a
      key: sk-proxy-replace-me-aaaaa
    - name: service-b
      key: sk-proxy-replace-me-bbbbb
  # Отдельный ключ для подключения TUI / админ-эндпоинтов
  admin_key: sk-admin-replace-me

# Стратегия маршрутизации:
#   model_affinity_least_busy   — предпочесть сервер, где модель уже загружена,
#                                  иначе с наименьшей очередью.
#   round_robin                  — чередовать.
#   least_busy                   — только по длине очереди.
#   deferred_model_then_capable  — сервер назначается только при освобождении:
#                                   сначала запрос под current_model, иначе
#                                   первый совместимый.
#   preserve_model_coverage      — как deferred, но активно «защищает» уникальное
#                                   покрытие: если сервер — единственный держатель
#                                   своей модели, он не свопает её, пока для неё
#                                   ещё есть задачи в очереди (ПО УМОЛЧАНИЮ).
#   fair_share_round_robin       — как deferred, но с защитой от голодания
#                                   (starvation): после N подряд диспатчей одной
#                                   модели сервер ПРИНУДИТЕЛЬНО переключается на
#                                   следующую модель из очереди (если такая есть).
#                                   Лимит задаётся в scheduler.max_consecutive_per_model;
#                                   при 0 стратегия идентична deferred. Полезно,
#                                   когда поток к одной популярной модели иначе
#                                   полностью блокирует остальные.
routing:
  strategy: preserve_model_coverage

# Дополнительные параметры планировщика, действующие в комбинации со
# стратегией маршрутизации. Игнорируются стратегиями, которые ими не пользуются.
scheduler:
  # Используется ТОЛЬКО при routing.strategy = fair_share_round_robin.
  # После N подряд диспатчей одной модели на сервере воркер берёт следующий
  # job для ДРУГОЙ модели, даже если в очереди ещё есть задачи под текущую.
  # 0 = лимит отключён (стратегия деградирует к deferred_model_then_capable).
  # Типичные значения: 5–20 — баланс между throughput одной популярной модели
  # и отзывчивостью «соседей» в очереди.
  max_consecutive_per_model: 0

# Retry при ошибках бэкенда
#
# Семантика (v1.0+): max_attempts — это ОБЩЕЕ число попыток у одного запроса
# поверх всех серверов. После ошибки следующая попытка стремится уйти на
# другой healthy-сервер с этой моделью; «упавший» сервер исключается
# только на одну следующую попытку (rolling exclusion size 1). Если других
# совместимых серверов нет — повторяется на том же. Между попытками —
# экспоненциальный backoff (initial → ×2 → ... → насыщение max_backoff_ms).
retry:
  max_attempts: 3            # общее число попыток на запрос (включая первую)
  initial_backoff_ms: 500    # экспоненциальный backoff
  max_backoff_ms: 8000

# Авто-обнаружение моделей на серверах (через /v1/models)
discovery:
  enabled: true
  interval_seconds: 30
  unhealthy_after_failed_polls: 3

# Хранение истории запросов
# Путь относительный — резолвится относительно каталога бинарника (portable).
storage:
  database_path: ./proxylm.db
  history_retention_days: 30
  vacuum_on_start: false

# TUI
tui:
  show_completed_minutes: 30      # сколько держать завершённые в таблице (на стороне TUI)

# Совместимость OpenAI-совместимых бэкендов по response_format:
#   passthrough            — отправлять как есть (по умолчанию)
#   normalize_json_object  — преобразовать response_format.type=json_object в json_schema
#   strict_reject          — ранний 400 на прокси, если type не json_schema|text
compat:
  response_format_mode: passthrough

# Бэкенд-серверы.
#
# Работает с любым сервером, поддерживающим OpenAI-совместимый `/v1/*` API
# или Anthropic Messages API `/v1/messages`. Что крутится за URL'ом
# (LM Studio, Ollama, vLLM, llama.cpp, OpenRouter, Together AI, Groq,
# OpenAI, Anthropic и т.п.), прокси не задумывается.
#
# `name` — произвольная человекочитаемая метка (видна в TUI и логах).
#
# `type` — тип бэкенда:
#   openai     — (по умолчанию) OpenAI-совместимый /v1/chat/completions и т.п.
#   anthropic  — Anthropic Messages API /v1/messages
#   ollama     — OpenAI-совместимый shim + проба загруженных моделей (/api/ps)
#   lmstudio   — OpenAI-совместимый + проба загруженных моделей (/api/v1/models)
#   llamacpp   — OpenAI-совместимый + проба загруженных моделей (/models)
#
# Для ollama/lmstudio/llamacpp прокси дополнительно опрашивает нативный
# эндпоинт, чтобы знать, какие модели РЕАЛЬНО загружены в память (VRAM/RAM)
# прямо сейчас — это видно в TUI (панель сервера, строка «In memory») и
# помогает заметить idle-выгрузку. Для openai/anthropic проба отключена.
#
# Кросс-протокольная трансляция работает автоматически: клиент может
# подключаться через OpenAI API, а бэкенд быть Anthropic — и наоборот.
# Запросы /v1/completions и /v1/embeddings доступны только для OpenAI-бэкендов.
#
# `priority` — ниже число = выше предпочтение среди свободных серверов.
# Удобно для cloud-fallback: ставьте локалкам priority 100–200, облачному
# OpenRouter / Anthropic — 900.
backends:
  - name: lmstudio-desktop
    url: http://127.0.0.1:1234           # LM Studio default
    type: lmstudio                       # включает пробу загруженных моделей
    priority: 100
    timeout_seconds: 600
    api_key: null                        # null если auth не требуется
    # Опционально: явно перечислить модели (выключает discovery для этого сервера)
    # models:
    #   - qwen2.5:14b
    #   - llama3.1:8b

  - name: ollama-rack
    url: http://127.0.0.1:11434          # Ollama default (OpenAI-совместимый shim на /v1/*)
    type: ollama                         # включает пробу загруженных моделей (/api/ps)
    priority: 200
    timeout_seconds: 600

  # Cloud fallback — раскомментировать если хочется, чтобы OpenRouter
  # обслуживал запросы, когда локальные серверы заняты.
  # - name: openrouter-cloud
  #   url: https://openrouter.ai/api
  #   api_key: sk-or-v1-...
  #   priority: 900                      # высокий номер = подключается, когда локалки недоступны
  #   timeout_seconds: 120

  # Cloud Anthropic — раскомментировать для прямого доступа к Claude API.
  # Клиенты с OpenAI SDK тоже смогут обращаться через этот бэкенд — прокси
  # автоматически транслирует запросы между форматами.
  # - name: anthropic-cloud
  #   url: https://api.anthropic.com
  #   type: anthropic
  #   api_key: sk-ant-api03-...
  #   priority: 900
  #   timeout_seconds: 120
  #   models:
  #     - claude-sonnet-4-6
  #     - claude-haiku-4-5
